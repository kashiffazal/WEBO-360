<!DOCTYPE html>
<html>

<head>
  <meta name="description" content="A basic HTML page">
  <meta name="keywords" content="HTML,code,tags">
  <meta name="author" content="Dann Albright">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="background-color: #f2f2f2">


  <table style="border-collapse:collapse;table-layout:fixed;min-width:320px;width:100%;background-color:#f2f4f6"
    cellpadding="0" cellspacing="0" role="presentation">
    <tbody>
      <tr>
        <td>


          <div
            style="background-color: #fff;border:1px solid #d5d5d5;margin:30px auto;max-width:560px;min-width:280px;width:280px;width:calc(28000% - 167440px);font-family:sans-serif">
            <div style="padding:40px;padding-bottom: 0px">
              <a style="text-decoration:underline;color:#7856ff" href="[companyWebSite]">
                <img style="border:0;display:block;height:auto;width:100%;max-width:200px" alt="[company_name] logo"
                  width="200" src="[logo]">
              </a>
              <p style="margin:0px;margin-top:20px;font-size: 28px">Your Campaign has been sent</p>
              <p style="line-height:24px">The campaign <strong>
                  <campaign_name /></strong> has been sent to <strong>
                  <total_subscribers /></strong> recipients, with the subject of <strong>
                  '
                  <subject />'</strong>.</p>
            </div>
            <div
              style="background: #f1faff;padding: 20px 40px;border-top: 1px solid #d5d5d5;border-bottom: 1px solid #d5d5d5;">
              <a href="[app_link]" style="font-size: 14px;font-weight: 600;color: #4856e6;">See the reports,</a> or <a
                href="[app_link]" style="font-size: 14px;font-weight: 600;color: #4856e6;">view this campaign</a>
            </div>
            <div style="padding:40px;padding-top: 5px">
              <p style="margin-bottom:0px;margin-top: 15px;font-size:12px;color:#797979">Login to view a detailed report
                on this campaign including who opened it and when, what links they clicked on, who unsubscribed, etc.
              </p>
            </div>
          </div>
          <!--End Container -->

        </td>
      </tr>
    </tbody>
  </table>

</body>

</html>
